name: Deploy on push to live

on:
  push:
    branches:
      - live

# A later deployment must not race an earlier APIM import and leave the older
# OpenAPI document as the final state. Allow only one live deployment at a time.
concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      # The Pages publish job only runs when the CI script exported a verified
      # OpenAPI document, which happens when APIM synchronization is configured.
      openapi_available: ${{ steps.openapi.outputs.available }}
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install OpenAPI validator'
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0

      - name: 'Login via Azure CLI'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Run CI script'
        env:
          AZURE_REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
          AZURE_LIVE_APP_NAME: ${{ secrets.AZURE_LIVE_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_APIM_SERVICE_NAME: ${{ vars.AZURE_APIM_SERVICE_NAME }}
          AZURE_APIM_API_ID: ${{ vars.AZURE_APIM_API_ID }}
          AZURE_APIM_RESOURCE_GROUP: ${{ vars.AZURE_APIM_RESOURCE_GROUP }}
          OPENAPI_EXPORT_PATH: openapi.json
        run: s/ci

      - name: 'Record whether an OpenAPI document was exported'
        id: openapi
        run: |
          if [[ -f openapi.json ]]; then
            echo 'available=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            echo '::notice title=GitHub Pages publish skipped::APIM synchronization did not run, so no OpenAPI document was exported.'
          fi

      - name: 'Upload OpenAPI document for Pages publish'
        if: steps.openapi.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-document
          path: openapi.json
          if-no-files-found: error

  publish-openapi-to-pages:
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.openapi_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Download OpenAPI document'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-document
          path: site

      - name: 'Configure GitHub Pages'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 'Upload GitHub Pages artifact'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: 'Deploy OpenAPI document to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deployment-reminder:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 'Ask maintainers to verify APIM'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          pr_number=$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${DEPLOYED_SHA}/pulls" \
            --jq 'map(select(.base.ref == "live")) | first | .number // empty')

          if [[ -z "${pr_number}" ]]; then
            echo '::notice title=APIM verification required::Open the Azure portal and verify the imported API operations and policies.'
            exit 0
          fi

          run_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          body=$(printf '@pacharanero @mbarton: the live deployment and APIM OpenAPI import completed successfully. Please verify the API operations and policies in the Azure portal.\n\nDeployment: %s' "${run_url}")
          gh pr comment "${pr_number}" --repo "${REPOSITORY}" --body "${body}"
