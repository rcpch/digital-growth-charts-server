name: Deploy on push to live

on:
  push:
    branches:
      - live

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install OpenAPI validator'
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0

      - name: 'Login via Azure CLI'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Run CI script'
        env:
          AZURE_REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
          AZURE_LIVE_APP_NAME: ${{ secrets.AZURE_LIVE_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_APIM_SERVICE_NAME: ${{ vars.AZURE_APIM_SERVICE_NAME }}
          AZURE_APIM_API_ID: ${{ vars.AZURE_APIM_API_ID }}
          AZURE_APIM_RESOURCE_GROUP: ${{ vars.AZURE_APIM_RESOURCE_GROUP }}
        run: s/ci

  deployment-reminder:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 'Ask maintainers to verify APIM'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          pr_number=$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${DEPLOYED_SHA}/pulls" \
            --jq 'map(select(.base.ref == "live")) | first | .number // empty')

          if [[ -z "${pr_number}" ]]; then
            echo '::notice title=APIM verification required::Open the Azure portal and verify the imported API operations and policies.'
            exit 0
          fi

          run_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          body=$(printf '@pacharanero @mbarton: the live deployment and APIM OpenAPI import completed successfully. Please verify the API operations and policies in the Azure portal.\n\nDeployment: %s' "${run_url}")
          gh pr comment "${pr_number}" --repo "${REPOSITORY}" --body "${body}"
