name: Deploy on push to live

on:
  push:
    branches:
      - live
      # TODO MRB: remove before merge
      - mbarton/container-build

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main
      
      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Run CI script'
        env:
          AZURE_REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
          # AZURE_STAGING_APP_NAME: ${{ secrets.AZURE_STAGING_APP_NAME }}
          # AZURE_LIVE_APP_NAME: ${{ secrets.AZURE_LIVE_APP_NAME }}
          # AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: s/ci
