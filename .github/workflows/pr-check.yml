name: Run Pytest on pushes to main branches or PRs to any branch

on:
  pull_request:
    branches:
      - "*"

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run PR check script
        run: s/pr-check
