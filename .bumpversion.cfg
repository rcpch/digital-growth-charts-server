[bumpversion]
current_version = 5.0.0
tag = True
commit = True

[bumpversion:file:main.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:CITATION.cff]
search = version: {current_version}
replace = version: {new_version}

[bumpversion:file:openapi.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"
